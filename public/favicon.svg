<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    
    <!-- Accent gradient for chart elements -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square with gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner subtle pattern - grid lines suggesting data/spreadsheets -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.5">
    <line x1="16" y1="16" x2="48" y2="16"/>
    <line x1="16" y1="24" x2="48" y2="24"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="16" y1="40" x2="48" y2="40"/>
    <line x1="16" y1="48" x2="48" y2="48"/>
    <line x1="24" y1="12" x2="24" y2="52"/>
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="40" y1="12" x2="40" y2="52"/>
  </g>
  
  <!-- Main icon: Chart/Graph representing financial analytics -->
  <g filter="url(#glow)">
    
    <!-- Bar chart bars - showing growth -->
    <rect x="17" y="36" width="7" height="14" rx="2" fill="#ffffff" opacity="0.9">
      <animate attributeName="height" from="0" to="14" dur="0.5s" fill="freeze"/>
      <animate attributeName="y" from="50" to="36" dur="0.5s" fill="freeze"/>
    </rect>
    
    <rect x="28" y="28" width="7" height="22" rx="2" fill="#ffffff" opacity="0.95">
      <animate attributeName="height" from="0" to="22" dur="0.6s" fill="freeze"/>
      <animate attributeName="y" from="50" to="28" dur="0.6s" fill="freeze"/>
    </rect>
    
    <rect x="39" y="20" width="7" height="30" rx="2" fill="url(#accentGrad)">
      <animate attributeName="height" from="0" to="30" dur="0.7s" fill="freeze"/>
      <animate attributeName="y" from="50" to="20" dur="0.7s" fill="freeze"/>
    </rect>
    
    <!-- Trend line overlay - showing upward growth -->
    <path d="M 18 42 Q 25 38, 31 32 T 43 18" 
          stroke="#34d399" 
          stroke-width="3" 
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.95">
      <animate attributeName="stroke-dasharray" from="0,200" to="200,0" dur="1s" fill="freeze"/>
    </path>
    
    <!-- Trend arrow head -->
    <polygon points="43,14 47,20 39,20" fill="#34d399" opacity="0.95">
      <animate attributeName="opacity" from="0" to="0.95" dur="0.8s" fill="freeze"/>
    </polygon>
    
    <!-- Dollar/Currency symbol integrated subtly -->
    <text x="46" y="26" 
          font-family="Arial, sans-serif" 
          font-size="10" 
          font-weight="bold" 
          fill="#ffffff" 
          opacity="0.9">$</text>
    
    <!-- Connection dots on trend line (representing "nexus"/connection) -->
    <circle cx="18" cy="42" r="2.5" fill="#ffffff" opacity="0.9">
      <animate attributeName="r" from="0" to="2.5" dur="0.5s" fill="freeze"/>
    </circle>
    <circle cx="31" cy="32" r="2.5" fill="#ffffff" opacity="0.9">
      <animate attributeName="r" from="0" to="2.5" dur="0.65s" fill="freeze"/>
    </circle>
    <circle cx="43" cy="18" r="3" fill="#34d399" opacity="0.95">
      <animate attributeName="r" from="0" to="3" dur="0.8s" fill="freeze"/>
    </circle>
    
  </g>
  
  <!-- Subtle shine effect on top -->
  <ellipse cx="32" cy="10" rx="20" ry="6" fill="#ffffff" opacity="0.15"/>
  
</svg>