<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="growth" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4c1d95" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect x="4" y="4" width="56" height="56" rx="16" ry="16" fill="url(#main)" filter="url(#shadow)"/>
  
  <rect x="8" y="8" width="48" height="48" rx="12" ry="12" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  
  <g transform="translate(14, 16)">
    
    <rect x="0" y="18" width="8" height="18" rx="2.5" fill="white" opacity="0.95"/>
    
    <rect x="11" y="10" width="8" height="26" rx="2.5" fill="white"/>
    
    <rect x="22" y="14" width="8" height="22" rx="2.5" fill="white" opacity="0.9"/>
    
    <path d="M 6 22 L 24 10" 
          stroke="url(#growth)" 
          stroke-width="3.5" 
          stroke-linecap="round"
          fill="none"
          opacity="0.95"/>
    
    <polygon points="27,7 30,13 23,11" fill="url(#growth)" opacity="0.95"/>
    
    <circle cx="6" cy="22" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="15" cy="17" r="2" fill="#34d399" opacity="0.9"/>
    <circle cx="24" cy="10" r="2.5" fill="#34d399"/>
    
  </g>
  
  <ellipse cx="32" cy="14" rx="18" ry="8" fill="white" opacity="0.1"/>
  
</svg>